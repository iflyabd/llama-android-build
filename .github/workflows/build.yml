name: llama-android-arm64
on:
  workflow_dispatch:
    inputs:
      ref:
        description: llama.cpp tag/branch
        default: master
        required: false
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ inputs.ref || 'master' }}
          submodules: false

      - name: Fetch Android NDK r27d (direct zip, no sdkmanager)
        run: |
          curl -sL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q /tmp/ndk.zip -d /tmp && rm /tmp/ndk.zip
          echo "NDK_PATH=/tmp/android-ndk-r27d" >> $GITHUB_ENV
          ls /tmp/android-ndk-r27d/toolchains/llvm/prebuilt/linux-x86_64/bin/clang

      - name: Configure (arm64, static STL, no native)
        run: |
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_BACKEND_DL=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=ON \
            -DGGML_VULKAN=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-android --target llama-server llama-cli -j $(nproc)

      - name: Package
        run: |
          mkdir -p out
          cp build-android/bin/llama-server build-android/bin/llama-cli out/ 2>/dev/null || \
            find build-android -name 'llama-server' -exec cp {} out/ \;
          find build-android -name 'llama-cli' -exec cp {} out/ \;
          find build-android -name '*.so' -exec cp {} out/ \;
          ls -lh out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-android-arm64
          path: out/
          retention-days: 30
