name: llama-android-arm64
on:
  workflow_dispatch:
    inputs:
      ref:
        description: llama.cpp tag/branch
        default: v0.6.0
        required: false
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ inputs.ref || 'v0.6.0' }}
          submodules: false

      - name: Setup Android NDK r27
        uses: android-actions/setup-android@v3
      - run: |
          sdkmanager --install "ndk;r27" 2>&1 | tail -1
          echo "NDK_PATH=$ANDROID_SDK_ROOT/ndk/r27" >> $GITHUB_ENV

      - name: Configure (arm64, static STL, no native)
        run: |
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_BACKEND_DL=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=ON \
            -DGGML_VULKAN=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-android --target llama-server llama-cli -j $(nproc)

      - name: Package
        run: |
          mkdir -p out
          cp build-android/bin/llama-server build-android/bin/llama-cli out/ 2>/dev/null || \
            find build-android -name 'llama-server' -exec cp {} out/ \;
          find build-android -name 'llama-cli' -exec cp {} out/ \;
          ls -lh out/
          file out/* || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-android-arm64
          path: out/
          retention-days: 30
